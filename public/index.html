<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>One-time voice note</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>One-time voice note</h1>
  <p class="sub">Type text or pick a file. Get a link that plays once.</p>
  <form id="f">
    <textarea id="text" rows="5" maxlength="1000" placeholder="Type something to say" aria-label="Text to turn into a voice note"></textarea>

    <div id="drop" class="drop" tabindex="0" role="button" aria-label="Choose a .txt or audio file">
      <input id="file" type="file" accept=".txt,text/plain,audio/*" hidden>
      <span id="dropLabel">Choose a .txt or audio file, or drop it here</span>
      <span id="picked" hidden><span id="fileName"></span> <a href="#" id="clear">remove</a></span>
    </div>

    <select id="voice" aria-label="Voice for typed text">
      <option value="af_heart">Voice: Heart (female)</option>
      <option value="af_bella">Voice: Bella (female)</option>
      <option value="bf_emma">Voice: Emma (British, female)</option>
      <option value="am_michael">Voice: Michael (male)</option>
      <option value="am_onyx">Voice: Onyx (deep male)</option>
      <option value="bm_george">Voice: George (British, male)</option>
    </select>

    <button id="go" type="submit">Create link</button>
    <p id="msg" class="status" role="status"></p>
  </form>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
